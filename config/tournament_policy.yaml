# Honest monthly tournament policy for the 1D-30D forecasters (read by data/gold/tertip_multi_horizon_crowning.py).
# Every month, per stock and horizon, champions are crowned on the first trading day from outcomes realized before
# it. Tested end-to-end on the honest 90-session track (docs/RESEARCH_HANDOFF_2026-10.md §0.8).

# Active feature sets (pruned per horizon in `swing_pools` and `update_t1_candidate_ledger` when `priority_stocks`
# is empty so unused feature sets are not redundantly evaluated).
feature_sets: [production, events, regime_no_sma50]

# Staged per-stock feature tournament disabled (empty): per-stock monthly feature choice on 90 sessions adds
# selection noise compared to fixed horizon-specialized policies.
priority_stocks: []
stage2_allowed:
  1d: [events]
  3d: [events]
  5d: [regime_no_sma50]
  10d: [regime_no_sma50]
  15d: [production]
  30d: [production]

# Validated tabular Policy C feature set per horizon (crowned monthly strictly on target_date_end < crown_date):
default_policy:
  1d: {feature_set: events}
  3d: {feature_set: events}
  5d: {feature_set: regime_no_sma50}
  10d: {feature_set: regime_no_sma50}
  15d: {feature_set: production, exclude_lookback: 63}
  30d: {feature_set: production}

# Validated Two-Stage Decoupled Timestral-209M + Policy C Hybrid (`models/timestral_forecaster.py`):
# Stage 1 (Direction Specialist): combines Cross-Asset `Market-6` & `Peer-Group` Timestral consensus,
# Intra-Patch `10D` wave coherence, single-stock multi-scale Timestral (`L in [32, 64, 128, 256]`),
# and BIST 30 (`XU030`) shock/regime-gated Policy C institutional Tertip FIFO flow alpha.
# Stage 2 (Full-Amplitude Swing Sizing): sizes every call to `0.5 * |q75 - q25|` modulated by conviction
# and blended (65%/35%) with Policy C flow amplitude, enforcing BIST +-10% daily circuit breakers.
timestral_hybrid:
  enabled: true
  architecture: two_stage_decoupled_direction_first_full_amplitude
  bist_daily_limit_pct: 9.95
  horizons:
    1d: {stage1: cross_asset_m6_p10_wave_and_bist30_gated_policy_c, contexts: [32, 64, 128]}
    3d: {stage1: stock_short_peer_m6_consensus_and_policy_c, contexts: [32, 64, 128]}
    5d: {stage1: peer_stock_m6_consensus_and_regime_gated_policy_c, contexts: [64, 128, 256]}
    10d: {stage1: multi_scale_stock_and_policy_c_snr_fusion, contexts: [64, 128, 256]}
    15d: {stage1: multi_scale_stock_and_policy_c_snr_fusion, contexts: [64, 128, 256]}
    30d: {stage1: two_patch_64_and_policy_c_snr_fusion, contexts: [64]}
