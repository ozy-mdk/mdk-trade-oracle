# Honest monthly tournament policy for the 1D-30D forecasters (read by data/gold/tertip_multi_horizon_crowning.py).
# Every month, per stock and horizon, champions are crowned on the first trading day from outcomes realized before
# it. Tested end-to-end on the honest 90-session track (docs/RESEARCH_HANDOFF_2026-10.md §0.8); re-run
# scripts/experiments/tournament_variants.py before changing anything here.

# Feature sets with candidate ledgers at every horizon (data/silver/event_regime_features.py)
feature_sets: [production, events, regime_no_sma50]

# Stocks listed here use the staged tournament: stage 1 crowns model + training window on the production features
# (production rule: family-first for 3D-30D, 1D on its own); stage 2 picks feature set x feature mode for that model
# and window from `stage2_allowed`. Disabled (empty): tested on the honest track it did not beat the default policy
# (focus six + THYAO: +0.1 pp average vs the previous production, against +1.9 for the default policy) — per-stock
# monthly feature choice on 90 sessions adds selection noise. Re-test before enabling for any stock.
priority_stocks: []
stage2_allowed:
  1d: [production, events]
  3d: [production, events]
  5d: [production, regime_no_sma50]
  10d: [production, regime_no_sma50]
  15d: [production]
  30d: [production]

# All stocks (default): the validated feature set per horizon, crowned within that pool (policy C: +1.9 pp average on
# the focus six + THYAO, neutral on the other 22). 30D keeps its own production crowning so the other horizons cannot move its model family.
default_policy:
  1d: {feature_set: events}
  3d: {feature_set: events}
  5d: {feature_set: regime_no_sma50}
  10d: {feature_set: regime_no_sma50}
  15d: {feature_set: production, exclude_lookback: 63}
  30d: {feature_set: production, own_production_crowning: true}
