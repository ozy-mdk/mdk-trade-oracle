# General Application Settings
market: BIST
timezone: Europe/Istanbul
primary_institution: MLB  # Bank of America / Merrill Lynch

# Lakehouse Storage Settings
# Note: Physical data is stored outside the repository at DATA_DIR (default: ~/data/mdk_oracle)
storage:
  raw_subpath: 00_raw_data
  database_subpath: database/mdk_oracle.duckdb

# Analytical & Feature Settings (For Silver & Gold Lakehouse Layers)
features:
  rolling_windows: [3, 5, 10, 20]
  flow_acceleration_window: 5
  significant_share_threshold: 0.15  # 15% broker market share

# Oracle Signal Evaluation Parameters
oracle:
  bofa_accumulation_zscore_threshold: 1.5
  bofa_distribution_zscore_threshold: -1.5
  min_confidence_score: 0.60

# Quantitative Gold Predictive Models Configuration
models:
  # Global Fallback Defaults
  default_lookback_months: 12        # Trailing history window (None = full available history)
  default_eval_window_days: 20       # Out-of-sample evaluation window for Model Arena tournament
  default_burn_in_days: 5            # Minimum warmup samples before walk-forward scoring starts

  # Model 1: Macro Day-Start Forecaster
  day_start:
    lookback_months: 12              # Trailing 12 months (~250 trading days) from latest date
    eval_window_days: 20             # Evaluate tournament on the trailing 20 days
    min_burn_in_days: 5              # Minimum initial window for tournament
    model_type: "auto"               # Default candidate selection paradigm ("auto", "bayesian", "lightgbm", "pymc")
    include_pymc_arena: true

  # Model 2: Sector Day-Start Allocation Forecaster
  sector_day_start:
    lookback_months: 12              # Trailing 12 months per sector
    eval_window_days: 20             # Evaluate tournament on the trailing 20 days
    min_burn_in_days: 5
    model_type: "auto"
    include_pymc_arena: false        # Fast mode across 26 sectors

# Parameterized Intraday Time Windows (Raw feed timestamps in UTC)
# BIST continuous session: 07:55 - 16:15 UTC (09:55 - 18:15 Istanbul TRT)
intraday_windows:
  - name: "day_start"
    label: "Day Start (Opening 30m)"
    start_time: "07:55:00"
    end_time: "08:30:00"
    order: 1
  - name: "morning_to_lunch"
    label: "Morning to Lunch"
    start_time: "08:30:00"
    end_time: "11:00:00"
    order: 2
  - name: "lunch_to_15"
    label: "Lunch to 15:00"
    start_time: "11:00:00"
    end_time: "13:00:00"
    order: 3
  - name: "closing_session"
    label: "15:00 to Day Close"
    start_time: "13:00:00"
    end_time: "16:15:00"
    order: 4

