# General Application Settings
market: BIST
timezone: Europe/Istanbul
primary_institution: MLB  # Bank of America / Merrill Lynch

# Lakehouse Storage Settings
# Note: Physical data is stored outside the repository at DATA_DIR (default: ~/data/mdk_oracle)
storage:
  raw_subpath: 00_raw_data
  database_subpath: database/mdk_oracle.duckdb

# Analytical & Feature Settings (For Silver & Gold Lakehouse Layers)
features:
  rolling_windows: [3, 5, 10, 20]
  flow_acceleration_window: 5
  significant_share_threshold: 0.15  # 15% broker market share

# Oracle Signal Evaluation Parameters
oracle:
  bofa_accumulation_zscore_threshold: 1.5
  bofa_distribution_zscore_threshold: -1.5
  min_confidence_score: 0.60

# Quantitative Gold Predictive Models Configuration
models:
  # Global Fallback Defaults
  default_lookback_months: 12        # Trailing history window (None = full available history)
  default_eval_window_days: 20       # Out-of-sample evaluation window for Model Arena tournament
  default_burn_in_days: 5            # Minimum warmup samples before walk-forward scoring starts

  # Model 1: Macro Day-Start Forecaster
  day_start:
    lookback_months: 12              # Trailing 12 months (~250 trading days) from latest date
    eval_window_days: 20             # Evaluate tournament on the trailing 20 days
    min_burn_in_days: 5              # Minimum initial window for tournament
    model_type: "auto"               # Default candidate selection paradigm ("auto", "bayesian", "lightgbm", "pymc")
    include_pymc_arena: true

  # Model 2: Sector Day-Start Allocation Forecaster
  sector_day_start:
    lookback_months: 12              # Trailing 12 months per sector
    eval_window_days: 20             # Evaluate tournament on the trailing 20 days
    min_burn_in_days: 5
    model_type: "auto"
    include_pymc_arena: false        # Fast mode across 26 sectors

  # Model 3: BIST30 Stock Intraday Reaction Forecaster
  stock_reaction:
    lookback_months: 12              # Trailing 12 months per stock
    eval_window_days: 10             # Evaluate on trailing 10 days (more granular per stock)
    min_burn_in_days: 5
    model_type: "auto"
    include_pymc_arena: false        # Fast mode across 30 stocks x 3 windows

    # Symbol filtering — default null = all BIST30 stocks from bronze_instruments
    # Set to a list for a permanently restricted universe, e.g.: ["AKBNK", "GARAN"]
    # Override at runtime with: --symbols AKBNK,GARAN  or  --symbols-file config/watchlist.txt
    symbols: null

    # Reaction windows to forecast — can disable individual windows if not needed
    windows: ["first_reaction", "midday_followup", "closing_session"]

    # Broker universe for FIFO Tertip inventory tracking
    # MLB = BofA (primary), IYM/YKR/AKM/GRM/ZRY = Top-5 domestic, TRA = Tera (retail contra)
    fifo_brokers:
      - MLB   # Bank of America (primary institutional target)
      - IYM   # Is Yatirim (largest domestic aggregator)
      - YKR   # Yapi Kredi (active institutional + prop desk)
      - AKM   # Ak Yatirim (high-volume domestic)
      - GRM   # Garanti BBVA (institutional liquidity provider)
      - ZRY   # Ziraat (public/state institution flow)
      - TRA   # Tera Yatirim (retail aggregator — contra-side signal)

# Historical Performance Ledger & Point-in-Time Backfill Configuration
backfill:
  default_lookback_months: 2         # Default window when running --backfill-missing (2 months)
  default_lookback_days: null        # Optional specific day lookback override (e.g., 60)

# Parameterized Intraday Time Windows (Turkish Time TRT / Europe/Istanbul)
# BIST continuous session: 09:55 - 18:15 TRT across 5 distinct microstructure windows
intraday_windows:
  - name: "day_start"
    label: "Day Start (09:55 - 10:30)"
    start_time: "09:55:00"
    end_time: "10:30:00"
    order: 1
  - name: "first_reaction"
    label: "First Reaction (10:30 - 11:30)"
    start_time: "10:30:00"
    end_time: "11:30:00"
    order: 2
  - name: "midday_followup"
    label: "Midday Follow-up (11:30 - 14:30)"
    start_time: "11:30:00"
    end_time: "14:30:00"
    order: 3
  - name: "afternoon_reaction"
    label: "Afternoon Reaction (14:30 - 16:00)"
    start_time: "14:30:00"
    end_time: "16:00:00"
    order: 4
  - name: "closing_session"
    label: "Closing & Auction (16:00 - 18:15)"
    start_time: "16:00:00"
    end_time: "18:15:00"
    order: 5

